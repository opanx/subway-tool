name: Build subway_tool

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'build.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Build
        env:
          NDK_CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: subway_tool_bin
          path: build/subway_tool
          retention-days: 90

      - name: Upload wrapper script
        uses: actions/upload-artifact@v4
        with:
          name: subway_tool_sh
          path: release/subway_tool.sh
          retention-days: 90
